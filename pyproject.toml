[tool.poetry]
name = "pose-flex"
version = "0.1.0"
description = "Pose-Flex is a cutting-edge application that uses computer vision and machine learning to monitor and analyze your workout posture and movements. Whether you're a fitness enthusiast looking to perfect your form or a beginner wanting guidance, Pose-Flex offers valuable insights to enhance your exercise routine."
authors = ["Mitangshu"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
mediapipe = "0.10.14"
opencv-python = "^4.10"
numpy = "^2.0.1"
matplotlib = "^3.9"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
